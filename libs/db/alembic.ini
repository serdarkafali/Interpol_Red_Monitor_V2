# Alembic configuration of the interpol-db package.
# The database URL is intentionally not stored here: env.py reads DATABASE_URL from
# the environment or from the repository's .env file.

[alembic]
script_location = %(here)s/src/interpol_db/migrations
prepend_sys_path = .
path_separator = os
# Readable, sortable migration file names: 2026_10_17_2015-<rev>_<message>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Format and lint every newly generated migration with the project's ruff settings.
hooks = ruff_format, ruff_check
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
