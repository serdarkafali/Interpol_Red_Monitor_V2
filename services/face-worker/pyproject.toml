[project]
name = "interpol-face-worker"
version = "0.1.0"
description = "Interpol fotoğraflarını indirip nesne deposuna yazan servis"
readme = "README.md"
authors = [
    { name = "Serdar", email = "serdarkfl8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "botocore>=1.44.9",
    "curl-cffi>=0.17.0",
    "interpol-db",
    "interpol-observability",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
interpol-face-worker = "interpol_face_worker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.deptry]
# The package's own module; deptry cannot detect it in the src layout.
known_first_party = ["interpol_face_worker"]

[tool.uv.sources]
interpol-observability = { workspace = true }
interpol-db = { workspace = true }
