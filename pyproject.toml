[project]
name = "interpol-monitor"
version = "0.1.0"
description = "Interpol Red Notice kayıtlarını toplayan, işleyen ve analiz eden servisler"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "curl-cffi>=0.16.3",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["interpol_*"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["libs/*/src", "services/*/src"]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = ["--import-mode=importlib"]
