[project]
name = "interpol-monitor"
version = "0.1.0"
description = "Interpol Red Notice kayıtlarını toplayan, işleyen ve analiz eden servisler"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "curl-cffi>=0.16.3",
    "deptry>=0.25.1",
    "httpx2>=2.16.2",
    "import-linter>=2.17",
    "mypy>=2.4.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "structlog>=26.1.0",
    "testcontainers[postgres]>=4.15.0",
    "types-boto3[s3]>=1.44.9",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["interpol_*"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["libs/*/src", "libs/*/tests", "services/*/src", "services/*/tests"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_packages = [
    "interpol_contracts",
    "interpol_db",
    "interpol_observability",
    "interpol_collector",
    "interpol_ingestor",
    "interpol_face_worker",
    "interpol_web",
]

[[tool.importlinter.contracts]]
name = "Services do not import each other"
type = "independence"
modules = ["interpol_collector", "interpol_ingestor", "interpol_face_worker", "interpol_web"]

[[tool.importlinter.contracts]]
name = "Libraries do not import services"
type = "forbidden"
source_modules = ["interpol_contracts", "interpol_db", "interpol_observability"]
forbidden_modules = [
    "interpol_collector",
    "interpol_ingestor",
    "interpol_face_worker",
    "interpol_web",
]

[[tool.importlinter.contracts]]
name = "Libraries do not import each other"
type = "independence"
modules = ["interpol_contracts", "interpol_db", "interpol_observability"]

[[tool.importlinter.contracts]]
name = "The collector does not touch the database (ADR 0004)"
type = "forbidden"
source_modules = ["interpol_collector"]
forbidden_modules = ["interpol_db"]

# Higher layers may import lower ones, never the other way round. Modules on one line
# separated by "|" must not import each other. __init__ (main) and config are left out:
# main wires every module together.
[[tool.importlinter.contracts]]
name = "Collector layers"
type = "layers"
containers = ["interpol_collector"]
layers = [
    "service",
    "removal_tracker | detail_schedule | events | publishers",
    "list_scanner | curl_transport",
    "interpol_client | state_io",
]

[[tool.importlinter.contracts]]
name = "Ingestor layers"
type = "layers"
containers = ["interpol_ingestor"]
layers = ["service", "dead_letters", "handler", "repository", "normalize"]

[[tool.importlinter.contracts]]
name = "Face worker layers"
type = "layers"
containers = ["interpol_face_worker"]
layers = [
    "service",
    "repository | photo_store | curl_transport",
    "interpol_photos | face_analysis",
]

[[tool.importlinter.contracts]]
name = "Web layers"
type = "layers"
containers = ["interpol_web"]
layers = ["app", "routes | auth", "queries | photos", "filters"]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
addopts = ["--import-mode=importlib"]
