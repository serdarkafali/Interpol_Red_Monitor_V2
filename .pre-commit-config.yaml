repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry (every package declares what it imports)
        entry: uv run python scripts/check_dependencies.py
        language: system
        files: (\.py|pyproject\.toml)$
        pass_filenames: false
      - id: import-linter
        name: import-linter (architecture rules in pyproject.toml)
        entry: uv run lint-imports
        language: system
        files: (\.py|pyproject\.toml)$
        pass_filenames: false
