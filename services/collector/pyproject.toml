[project]
name = "interpol-collector"
version = "0.1.0"
description = "Interpol API'sinden red notice kayıtlarını toplayıp Kafka'ya yayınlayan servis"
readme = "README.md"
authors = [
    { name = "Serdar", email = "serdarkfl8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.0",
    "curl-cffi>=0.16.3",
    "interpol-contracts",
    "interpol-observability",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
interpol-collector = "interpol_collector:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
interpol-contracts = { workspace = true }
interpol-observability = { workspace = true }
