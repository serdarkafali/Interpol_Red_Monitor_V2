# Local development infrastructure. Credentials are read from the git-ignored .env file.
name: interpol-monitor

services:
  postgres:
    # PostgreSQL 18 with the pgvector extension (needed later for face embeddings).
    # Both versions are pinned so that the database never upgrades unexpectedly.
    image: pgvector/pgvector:0.8.2-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Apache Kafka in KRaft mode (no ZooKeeper): one node is both broker and controller.
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST serves clients on this computer (localhost), DOCKER serves other containers.
      KAFKA_LISTENERS: CONTROLLER://:29093,HOST://:9092,DOCKER://:19092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # Fixed, so that the data volume keeps matching the cluster across restarts.
      CLUSTER_ID: EvKh8mt0TP-s1dXxqWLwvQ
      # A single broker can hold only one copy of Kafka's internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created only by kafka-init (ADR 0005); a typo must not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    # Runs once after Kafka is healthy and creates the topics defined in ADR 0005.
    # --if-not-exists makes it safe to run again on every "docker compose up".
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        $$topics --bootstrap-server kafka:19092 --create --if-not-exists \
          --topic interpol.notices.v1 --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 --config cleanup.policy=delete
        for dlq in ingestor.dlq face-worker.dlq; do
          $$topics --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$dlq" --partitions 1 --replication-factor 1 \
            --config retention.ms=604800000
        done
        $$topics --bootstrap-server kafka:19092 --describe

  migrate:
    # Runs once after PostgreSQL is healthy and applies the Alembic migrations, so that
    # no service needs the right to change the schema (ADR 0004, ADR 0008).
    build:
      context: .
      dockerfile: libs/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: "no"

  collector:
    # Not started by a plain "docker compose up", because it reads the real Interpol API:
    # docker compose --profile collector up -d --build collector
    profiles: ["collector"]
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      COLLECTOR_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Dry run unless .env says otherwise: nothing is written to Kafka (ADR 0006).
      COLLECTOR_DRY_RUN: ${COLLECTOR_DRY_RUN:-true}
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-INFO}
      COLLECTOR_LOG_FORMAT: json
    volumes:
      # Removal state and detail schedule survive container restarts.
      - collector-state:/var/lib/collector
    # Time to finish the current step and save the state after "docker compose stop".
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ingestor:
    # Reads the notices topic and writes PostgreSQL (ADR 0008). Starts only after the
    # schema and the topics exist.
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      INGESTOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INGESTOR_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INGESTOR_IGNORE_CONTENT_HASH: ${INGESTOR_IGNORE_CONTENT_HASH:-false}
      INGESTOR_LOG_LEVEL: ${INGESTOR_LOG_LEVEL:-INFO}
      INGESTOR_LOG_FORMAT: json
    # Time to finish the current message and commit its offset after "docker compose stop".
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  kafka-data:
  collector-state:
