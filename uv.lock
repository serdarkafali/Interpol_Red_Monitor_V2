version = 1
revision = 5
requires-python = ">=3.12"

[manifest]
members = [
    "interpol-collector",
    "interpol-contracts",
    "interpol-monitor",
]

[[package]]
name = "interpol-collector"
version = "0.1.0"
source = { editable = "services/collector" }
dependencies = [
    { name = "interpol-contracts" },
]

[package.metadata]
requires-dist = [{ name = "interpol-contracts", editable = "libs/contracts" }]

[[package]]
name = "interpol-contracts"
version = "0.1.0"
source = { editable = "libs/contracts" }

[[package]]
name = "interpol-monitor"
version = "0.1.0"
source = { virtual = "." }
